<!--
  ACI Africa Original Abstract Geometric Woven-Band Divider
  Design: Original modern vector geometric interlaced chevron ribbon.
  Palette: Amber (#F5A623), Deep Orange (#B84700), Forest Green (#237326), Deep Ink (#141414).
  Not copied from any specific traditional textile; designed as an abstract pan-African graphic element.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 32" width="100%" height="32" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <pattern id="wovenRepeat" width="80" height="32" patternUnits="userSpaceOnUse">
      <!-- Base track -->
      <rect width="80" height="32" fill="#FFFFFF"/>
      <!-- Top and bottom hairline margins -->
      <line x1="0" y1="2" x2="80" y2="2" stroke="#E5E5E5" stroke-width="1"/>
      <line x1="0" y1="30" x2="80" y2="30" stroke="#E5E5E5" stroke-width="1"/>
      <!-- Interlaced chevron bands -->
      <polygon points="0,4 20,4 40,28 20,28" fill="#F5A623" opacity="0.9"/>
      <polygon points="20,4 40,4 60,28 40,28" fill="#B84700" opacity="0.9"/>
      <polygon points="40,4 60,4 80,28 60,28" fill="#237326" opacity="0.9"/>
      <polygon points="60,4 80,4 100,28 80,28" fill="#141414" opacity="0.15"/>
      <polygon points="40,4 20,28 0,28 20,4" fill="#141414" opacity="0.08"/>
      <!-- Micro accents -->
      <circle cx="20" cy="16" r="2.5" fill="#B84700"/>
      <circle cx="60" cy="16" r="2.5" fill="#F5A623"/>
    </pattern>
  </defs>
  <rect width="1200" height="32" fill="url(#wovenRepeat)"/>
</svg>
