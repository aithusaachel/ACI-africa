    <section class="ftco-section-3 img" style="background-image: url(images/bg_3.jpg);">

    		<div class="row d-md-flex">

    			<div class="img img-2 align-self-stretch" style="background-image: url(images/bg_4.jpg);"></div>
    		</div>
    		<div class="col-md-6 volunteer pl-md-5 ftco-animate">
    			<h3 class="mb-3">Make a Donation</h3>
    			<form id="donate-form" class="volunter-form">
            <div class="form-group">
              <input type="text" id="d-name" class="form-control" placeholder="Your Name" required>
            </div>
            <div class="form-group">
              <input type="email" id="d-email" class="form-control" placeholder="Your Email" required>
            </div>
            <div class="form-group">
              <input type="number" id="d-amount" class="form-control" placeholder="Donation Amount ($)" min="1">
            </div>
            <div class="form-group">
              <textarea id="d-message" cols="30" rows="3" class="form-control" placeholder="Message or cause you wish to support"></textarea>
            </div>
            <div class="form-group">
              <input type="submit" id="d-submit" value="Donate Now" class="btn stellar-btn-primary py-3 px-5">
            </div>
            <p id="d-feedback" style="margin-top:10px; display:none;"></p>
          </form>
          <script>
            document.getElementById('donate-form').addEventListener('submit', async function(e) {
              e.preventDefault();
              const btn = document.getElementById('d-submit');
              const fb = document.getElementById('d-feedback');
              btn.value = 'Processing…'; btn.disabled = true;
              try {
                const res = await fetch('http://localhost:3000/api/donate', {
                  method: 'POST',
                  headers: {'Content-Type': 'application/json'},
                  body: JSON.stringify({
                    name: document.getElementById('d-name').value,
                    email: document.getElementById('d-email').value,
                    amount: document.getElementById('d-amount').value,
                    message: document.getElementById('d-message').value
                  })
                });
                if (res.ok) {
                  fb.style.color = '#22c55e'; fb.textContent = '✓ Thank you for your generous donation! We will be in touch.'; fb.style.display = 'block';
                  this.reset();
                } else {
                  throw new Error();
                }
              } catch {
                fb.style.color = '#ef4444'; fb.textContent = '✗ Submission failed. Please try again.'; fb.style.display = 'block';
              }
              btn.value = 'Donate Now'; btn.disabled = false;
            });
          <\/script>
